name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test scripts/test-quiz.mjs
      - run: npm run build
      - run: npm run smoke
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: ab-sign-windows-x64
          path: out/make/**/*.zip
          if-no-files-found: error
